steps:
  # Build image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/eazyslot"
      - "."

  # Push image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/eazyslot"

  # Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - eazyslot
      - --image
      - gcr.io/$PROJECT_ID/eazyslot
      - --region
      - asia-south1
      - --platform
      - managed
      - --allow-unauthenticated
      - --port
      - "8080"
      - --memory
      - "2Gi"
      - --cpu
      - "1"
      - --concurrency
      - "1"
      - --max-instances
      - "1000"
      - --timeout
      - "3600"

images:
  - "gcr.io/$PROJECT_ID/eazyslot"

options:
  logging: CLOUD_LOGGING_ONLY
